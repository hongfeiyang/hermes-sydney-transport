version = 1
package = "hermes_sydney_transport"

[repository]
forbidden_paths = ["hermes_sydney_trains"]

[principles]
style = "ports-and-adapters data pipeline"
direction = "presentation -> application -> ports <- adapters"
canonical_contracts = "Pydantic request/result models"

[root_modules]
allowed = ["__init__"]

[extension]
# One audited registration call site; ToolSpec drives schemas and handlers.
registration_callers = ["bootstrap/registration.py"]
raw_sql_layers = ["adapters"]
tool_spec_callers = ["presentation/catalog.py"]
schema_generation_callers = ["presentation/spec.py"]
handler_factory_callers = ["bootstrap/registration.py"]
mode_spec_callers = ["bootstrap/modes.py"]
mode_registry_callers = ["bootstrap/modes.py"]
forbid_any_layers = ["ports", "application"]
forbid_typed_dict_layers = ["ports", "application"]
forbid_legacy_generic_syntax = true
require_dataclass_records_layers = ["ports"]
forbid_time_parsing_layers = ["application"]
infrastructure_literal_layers = ["adapters"]
infrastructure_literals = ["trip_updates", "vehicle_positions", "static_schedule"]
forbid_nested_loops_paths = ["application/realtime"]

[adapter_contract]
root = "adapters/tfnsw"
roles = ["catalogs", "platform", "codecs", "wire", "mappers", "stores", "repositories"]
allowed_root_modules = ["__init__"]
network_paths = ["adapters/tfnsw/platform/http.py"]
json_paths = ["adapters/tfnsw/codecs/json.py"]
csv_paths = ["adapters/tfnsw/codecs/csv.py"]
archive_paths = ["adapters/tfnsw/codecs/archive.py", "adapters/tfnsw/codecs/xlsx.py"]
xml_paths = ["adapters/tfnsw/codecs/xlsx.py"]
html_paths = ["adapters/tfnsw/codecs/rich_text.py"]
protobuf_paths = [
  "adapters/tfnsw/codecs/protobuf.py",
  "adapters/tfnsw/codecs/protobuf_alerts.py",
  "adapters/tfnsw/codecs/protobuf_core.py",
  "adapters/tfnsw/codecs/protobuf_realtime.py",
]
exception_paths = [
  "adapters/tfnsw/platform",
  "adapters/tfnsw/codecs",
  "adapters/tfnsw/stores",
  "presentation/envelopes.py",
]
forbid_application_dict_projection = true
forbid_any_roles = ["catalogs", "platform", "wire", "mappers", "stores", "repositories"]
require_pydantic_wire_models = true
wire_model_roots = ["WireModel"]
wire_timestamp_paths = ["adapters/tfnsw/wire/timestamps.py"]
forbid_manual_parsing_roles = ["repositories", "mappers"]

[adapter_roles.catalogs]
may_import = ["catalogs", "platform", "codecs"]

[adapter_roles.platform]
may_import = ["platform"]

[adapter_roles.codecs]
may_import = ["codecs", "wire"]

[adapter_roles.wire]
may_import = ["wire"]

[adapter_roles.mappers]
may_import = ["mappers", "wire"]

[adapter_roles.stores]
may_import = ["stores", "codecs"]

[adapter_roles.repositories]
may_import = [
  "repositories",
  "catalogs",
  "platform",
  "codecs",
  "wire",
  "mappers",
  "stores",
]

[limits]
application_max_lines = 250
application_max_complexity = 12
adapter_max_lines = 300
adapter_repository_max_lines = 200
adapter_mapper_max_lines = 120
adapter_max_complexity = 10

[layers.contracts]
paths = ["models"]
may_import = ["contracts"]
forbidden_capabilities = ["environment", "hermes", "network", "protobuf", "filesystem"]

[layers.ports]
paths = ["ports"]
may_import = ["contracts", "ports"]
forbidden_capabilities = ["environment", "hermes", "network", "protobuf", "filesystem"]

[layers.application]
paths = ["application"]
may_import = ["contracts", "ports", "application"]
forbidden_capabilities = ["environment", "hermes", "network", "protobuf", "filesystem"]

[layers.adapters]
paths = ["adapters"]
may_import = ["contracts", "ports", "adapters", "generated"]
forbidden_capabilities = ["hermes"]

[layers.presentation]
paths = ["presentation"]
may_import = ["contracts", "application", "presentation"]
forbidden_capabilities = ["environment", "network", "protobuf", "filesystem"]

[layers.bootstrap]
paths = ["bootstrap"]
may_import = ["contracts", "ports", "application", "adapters", "presentation", "bootstrap", "generated"]
forbidden_capabilities = []

[layers.generated]
paths = ["proto"]
may_import = ["generated"]
forbidden_capabilities = ["environment", "hermes", "network", "filesystem"]

[capabilities]
environment = ["os"]
filesystem = ["pathlib", "shutil", "tempfile", "zipfile"]
hermes = ["hermes_cli", "tools"]
network = ["http", "httpx", "requests", "urllib"]
protobuf = ["google.protobuf"]
